<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Nest Egg — Savings Goal Tracker</title>
<meta name="description" content="Track savings goals with visual jars."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/src/style.css"/>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<div id="live-region" aria-live="polite" aria-atomic="true" class="sr-only"></div>
<div id="storage-banner" role="alert" class="storage-banner" aria-live="assertive"></div>
<header class="site-header">
<div class="site-header__inner">
<div class="site-header__brand">
<span class="site-header__icon" aria-hidden="true">🫙</span>
<div><h1 class="site-header__title">Nest Egg</h1><p class="site-header__subtitle">Your personal savings goal tracker</p></div>
</div>
</div>
</header>
<main id="main-content" class="main-layout">
<aside class="add-jar-panel" aria-label="Add a new savings jar">
<div class="panel-card">
<h2 class="panel-card__title"><span aria-hidden="true">✨</span> New Jar</h2>
<form id="add-jar-form" novalidate>
<div class="form-field">
<label for="add-name" class="form-label">Jar name <span class="required" aria-hidden="true">*</span></label>
<input type="text" id="add-name" name="name" class="form-input" placeholder="e.g. Vacation Fund" maxlength="60" autocomplete="off" aria-required="true" aria-describedby="add-name-error"/>
<span id="add-name-error" class="form-error" role="alert" aria-live="polite"></span>
</div>
<div class="form-field">
<label for="add-emoji" class="form-label">Emoji icon <span class="form-hint">(optional)</span></label>
<input type="text" id="add-emoji" name="emoji" class="form-input form-input--emoji" placeholder="🫙" maxlength="4" autocomplete="off" aria-describedby="add-emoji-hint"/>
<span id="add-emoji-hint" class="form-hint-text">Leave blank for default jar emoji</span>
</div>
<div class="form-field">
<label for="add-target" class="form-label">Target amount <span class="required" aria-hidden="true">*</span></label>
<div class="input-prefix-wrap">
<span class="input-prefix" aria-hidden="true">$</span>
<input type="number" id="add-target" name="targetAmount" class="form-input form-input--prefixed" placeholder="500" min="0.01" step="0.01" aria-required="true" aria-describedby="add-target-error"/>
</div>
<span id="add-target-error" class="form-error" role="alert" aria-live="polite"></span>
</div>
<button type="submit" class="btn btn--primary btn--full"><span aria-hidden="true">＋</span> Add Jar</button>
</form>
</div>
</aside>
<section class="jars-section" aria-label="Your savings jars">
<div id="empty-collection" class="empty-state" aria-live="polite">
<div class="empty-state__inner">
<div class="empty-state__icon" aria-hidden="true">🫙</div>
<h2 class="empty-state__title">No jars yet!</h2>
<p class="empty-state__body">Start saving towards something meaningful. Add your first jar to get going.</p>
<button id="empty-cta-btn" class="btn btn--primary" type="button">Create your first jar</button>
</div>
</div>
<div id="jar-grid" class="jar-grid hidden" role="list" aria-label="Savings jars"></div>
</section>
</main>
<div id="deposit-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="deposit-modal-title" aria-hidden="true">
<div class="modal-box">
<div class="modal-header">
<h2 id="deposit-modal-title" class="modal-title">Add Deposit</h2>
<button id="close-deposit-modal" class="modal-close" type="button" aria-label="Close deposit dialog">
<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
</button>
</div>
<form id="deposit-form" novalidate>
<div class="form-field">
<label for="deposit-amount" class="form-label">Amount <span class="required" aria-hidden="true">*</span></label>
<div class="input-prefix-wrap">
<span class="input-prefix" aria-hidden="true">$</span>
<input type="number" id="deposit-amount" name="amount" class="form-input form-input--prefixed" placeholder="25.00" min="0.01" step="0.01" aria-required="true" aria-describedby="deposit-amount-error"/>
</div>
<span id="deposit-amount-error" class="form-error" role="alert" aria-live="polite"></span>
</div>
<div class="form-field">
<label for="deposit-date" class="form-label">Date <span class="form-hint">(optional)</span></label>
<input type="date" id="deposit-date" name="date" class="form-input" aria-describedby="deposit-date-hint"/>
<span id="deposit-date-hint" class="sr-only">Leave blank for today</span>
</div>
<div class="form-field">
<label for="deposit-note" class="form-label">Note <span class="form-hint">(optional)</span></label>
<input type="text" id="deposit-note" name="note" class="form-input" placeholder="e.g. Birthday gift" maxlength="210" aria-describedby="deposit-note-error"/>
<span id="deposit-note-error" class="form-error" role="alert" aria-live="polite"></span>
</div>
<div class="modal-actions">
<button type="button" class="btn btn--ghost" id="cancel-deposit">Cancel</button>
<button type="submit" class="btn btn--primary">Log Deposit</button>
</div>
</form>
</div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
